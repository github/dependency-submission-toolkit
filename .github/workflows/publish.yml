name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run packaging or publish a canary to npm
        type: choice
        options:
          - dry-run
          - canary
        default: dry-run
      canary-version:
        description: Prerelease version required for canary mode (e.g. 2.0.8-oidc.1)
        type: string

permissions:
  contents: read
  id-token: write # for provenance and publish access

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Show publishing toolchain
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run all
      - name: Select package version and npm tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MODE: ${{ inputs.mode }}
          CANARY_VERSION: ${{ inputs.canary-version }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            npm version "$RELEASE_TAG" --git-tag-version=false --allow-same-version
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              echo "tag=next" >> "$GITHUB_OUTPUT"
            else
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$MODE" == "canary" ]]; then
            if [[ ! "$CANARY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
              echo "::error::Canary mode requires a prerelease version, e.g. 2.0.8-oidc.1"
              exit 1
            fi
            npm version "$CANARY_VERSION" --git-tag-version=false --allow-same-version
            echo "tag=oidc-test" >> "$GITHUB_OUTPUT"
          else
            npm version prerelease --preid "dry-run.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --git-tag-version=false
            echo "tag=oidc-test" >> "$GITHUB_OUTPUT"
          fi
      - name: Dry-run npm publish
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: npm publish --dry-run --provenance --access public --tag oidc-test
        env:
          NODE_AUTH_TOKEN: ""
      - name: Publish to npm using OIDC
        if: github.event_name == 'release' || inputs.mode == 'canary'
        run: |
          if [[ "$NPM_TAG" == "latest" ]]; then
            npm publish --provenance --access public
          else
            npm publish --provenance --access public --tag "$NPM_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TAG: ${{ steps.version.outputs.tag }}
